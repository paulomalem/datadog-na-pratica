# Agent da versão final (v5): logs, APM, DogStatsD, NPM e a senha do Postgres. Arquivo completo (não é sobreposto).
# A API Key vem de um Secret
datadog:
  apiKeyExistingSecret: datadog-secret
  clusterName: lab-datadog

  # Mesmo env das aplicações (DD_ENV e label tags.datadoghq.com/env)
  tags:
    - env:dev

  kubelet:
    tlsVerify: false

  # No Kind os componentes do control-plane não expõem métricas como num cluster gerenciado;
  # sem isto o `agent status` mostra 3 erros de inicialização (etcd, kube_controller_manager, kube_scheduler)
  ignoreAutoConfig:
    - etcd
    - kube_controller_manager
    - kube_scheduler

  # Logs de todos os containers
  logs:
    enabled: true
    containerCollectAll: true

  # APM
  apm:
    portEnabled: true

  # Adicionando monitoramento de rede (Network Performance Monitoring) para o cluster
  networkMonitoring:
    enabled: true

  # DogStatsD
  dogstatsd:
    useHostPort: true
    nonLocalTraffic: true
    
agents:
  # Sem tolerância para o taint do control-plane: o Agent roda só no worker.
  # Um Agent só = um System Probe só (no Kind os nós dividem o kernel e o NPM só funciona em um).

  # Setando variável de ambiente para conexão com banco postgresql
  containers:
    agent:
      env:
        - name: DD_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-monitoring
              key: password

